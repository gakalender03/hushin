name: Contract Transfers

on:
  workflow_dispatch:

jobs:
  transfer:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install web3.py
        run: pip install web3

      - name: Run contract transfers
        env:
          PRIVATE_KEYS: ${{ secrets.PRIVATE_KEYDAC }}
        run: |
          python3 << 'EOF'
          from concurrent.futures import ThreadPoolExecutor
          from threading import Lock
          from web3 import Web3
          import os

          # =========================
          # CONFIG
          # =========================

          RPC_URL = (
              'https://rpctest.dachain.tech'
          )

          TARGET_ADDRESS = (
              Web3.to_checksum_address(
                  '0xB36ab4c2Bd6aCfC36e9D6c53F39F4301901Bd647'
              )
          )

          # Contract calldata hex
          HEX_DATA = (
              ''
          )

          # Amount of native token
          # set 0 if not needed
          AMOUNT_ETH = 0

          # FIXED GAS SETTINGS
          GAS_LIMIT = 300000
          GAS_PRICE_GWEI = 100

          MAX_WORKERS = 5
          CHAIN_ID = 21894

          # =========================
          # SETUP
          # =========================

          PRIVATE_KEYS = os.environ.get(
              'PRIVATE_KEYS', ''
          ).splitlines()

          w3 = Web3(
              Web3.HTTPProvider(
                  RPC_URL
              )
          )

          nonce_lock = Lock()
          nonce_map = {}

          def get_unique_nonce(
              address
          ):
              with nonce_lock:

                  if (
                      address
                      not in nonce_map
                  ):
                      nonce_map[
                          address
                      ] = (
                          w3.eth
                          .get_transaction_count(
                              address,
                              'pending'
                          )
                      )

                  nonce = (
                      nonce_map[
                          address
                      ]
                  )

                  nonce_map[
                      address
                  ] += 1

                  return nonce

          def send_from_key(pk):
              try:
                  pk = pk.strip()

                  if (
                      not pk
                      or len(pk) < 64
                  ):
                      return (
                          'Skipped '
                          'invalid key'
                      )

                  account = (
                      w3.eth.account
                      .from_key(pk)
                  )

                  nonce = (
                      get_unique_nonce(
                          account.address
                      )
                  )

                  tx = {
                      'nonce': nonce,
                      'to': (
                          TARGET_ADDRESS
                      ),
                      'value': (
                          w3.to_wei(
                              AMOUNT_ETH,
                              'ether'
                          )
                      ),
                      'gas': (
                          GAS_LIMIT
                      ),
                      'gasPrice': (
                          w3.to_wei(
                              GAS_PRICE_GWEI,
                              'gwei'
                          )
                      ),
                      'data': (
                          HEX_DATA
                      ),
                      'chainId': (
                          CHAIN_ID
                      )
                  }

                  signed = (
                      account
                      .sign_transaction(tx)
                  )

                  tx_hash = (
                      w3.eth
                      .send_raw_transaction(
                          signed.raw_transaction
                      )
                  )

                  return (
                      f'Sent | '
                      f'{account.address[:10]}... '
                      f'nonce={nonce} '
                      f'gas={GAS_LIMIT} '
                      f'tx='
                      f'{tx_hash.hex()}'
                  )

              except Exception as e:
                  return (
                      f'Error: '
                      f'{str(e)}'
                  )

          print(
              'Starting '
              'parallel '
              'contract '
              'transfers...'
          )

          valid_keys = [
              k for k
              in PRIVATE_KEYS
              if k.strip()
          ]

          print(
              f'Found '
              f'{len(valid_keys)} '
              f'valid keys'
          )

          with ThreadPoolExecutor(
              max_workers=
              MAX_WORKERS
          ) as executor:

              results = list(
                  executor.map(
                      send_from_key,
                      valid_keys
                  )
              )

          print(
              '\nResults:\n'
          )

          for result in results:
              print(result)

          print(
              '\nAll '
              'transactions '
              'submitted!'
          )

          EOF
