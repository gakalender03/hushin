name: Deploy Solana Token (Devnet)

on:
  workflow_dispatch:

jobs:
  deploy-token:
    runs-on: ubuntu-latest

    env:
      RPC_URL: https://api.devnet.solana.com

      # Token settings
      TOKEN_NAME: MyToken
      TOKEN_SYMBOL: MTK
      TOKEN_DECIMALS: 6
      TOTAL_SUPPLY: 1000000
      MINT_LIMIT: 1000000

      # GitHub Secret
      PRIVATE_KEY: ${{ secrets.SOLANA_PRIVATE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create deploy script
        run: |
          cat > deploy.js << 'EOF'
          const {
            Connection,
            Keypair,
            clusterApiUrl
          } = require("@solana/web3.js");

          const {
            createMint,
            getOrCreateAssociatedTokenAccount,
            mintTo
          } = require("@solana/spl-token");

          const {
            Metaplex,
            keypairIdentity
          } = require("@metaplex-foundation/js");

          // Fix bs58 import
          const bs58Module = require("bs58");
          const bs58 =
            bs58Module.default || bs58Module;

          async function main() {
            const connection =
              new Connection(
                process.env.RPC_URL,
                "confirmed"
              );

            // Decode Phantom private key
            const secretKey =
              bs58.decode(
                process.env.PRIVATE_KEY.trim()
              );

            const wallet =
              Keypair.fromSecretKey(
                Uint8Array.from(secretKey)
              );

            console.log(
              "Wallet:",
              wallet.publicKey.toBase58()
            );

            // Metaplex setup
            const metaplex =
              Metaplex.make(connection)
                .use(
                  keypairIdentity(wallet)
                );

            // Airdrop devnet SOL
            try {
              console.log(
                "Requesting devnet SOL..."
              );

              const sig =
                await connection.requestAirdrop(
                  wallet.publicKey,
                  2e9
                );

              await connection.confirmTransaction(
                sig,
                "confirmed"
              );

              console.log(
                "Airdrop complete"
              );
            } catch (err) {
              console.log(
                "Airdrop skipped:",
                err.message
              );
            }

            const decimals =
              Number(
                process.env
                  .TOKEN_DECIMALS
              );

            const totalSupply =
              Number(
                process.env
                  .TOTAL_SUPPLY
              );

            const mintLimit =
              Number(
                process.env
                  .MINT_LIMIT
              );

            // Mint limit check
            if (
              totalSupply >
              mintLimit
            ) {
              throw new Error(
                `TOTAL_SUPPLY (${totalSupply})
                 exceeds MINT_LIMIT (${mintLimit})`
              );
            }

            console.log(
              "Creating token..."
            );

            // Create SPL token mint
            const mint =
              await createMint(
                connection,
                wallet,
                wallet.publicKey,
                wallet.publicKey,
                decimals
              );

            console.log(
              "Token Mint:",
              mint.toBase58()
            );

            // Create ATA
            const tokenAccount =
              await getOrCreateAssociatedTokenAccount(
                connection,
                wallet,
                mint,
                wallet.publicKey
              );

            console.log(
              "Token Account:",
              tokenAccount.address.toBase58()
            );

            // Mint supply
            const amount =
              BigInt(totalSupply) *
              BigInt(
                10 ** decimals
              );

            console.log(
              "Minting supply..."
            );

            await mintTo(
              connection,
              wallet,
              mint,
              tokenAccount.address,
              wallet,
              amount
            );

            console.log(
              "Success!"
            );

            console.log(
              "Token Address:",
              mint.toBase58()
            );

            console.log(
              "Decimals:",
              decimals
            );

            console.log(
              "Total Supply:",
              totalSupply
            );
          }

          main().catch(err => {
            console.error(err);
            process.exit(1);
          });
          EOF

      - name: Install dependencies
        run: |
          npm init -y
          npm install \
            @solana/web3.js \
            @solana/spl-token \
            @metaplex-foundation/js \
            bs58

      - name: Run deployment
        run: node deploy.js
