name: Deploy BIOH3 Token + Mint 10 Supply

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm init -y
          npm install @solana/web3.js @solana/spl-token @metaplex-foundation/js bs58

      - name: Deploy Token + Mint 10
        env:
          SOLANA_PRIVATE_KEY: ${{ secrets.SOLANA_PRIVATE_KEY }}
          SOLANA_RPC: https://api.devnet.solana.com
        run: |
          node -e "
          const crypto = require('crypto');
          const { Connection, Keypair, clusterApiUrl } = require('@solana/web3.js');
          const {
            createMint,
            getOrCreateAssociatedTokenAccount,
            mintTo
          } = require('@solana/spl-token');

          const { Metaplex, keypairIdentity } = require('@metaplex-foundation/js');
          const bs58 = require("bs58");

          // -------------------------
          // UNIQUE NAME
          // -------------------------
          const rand = crypto.randomBytes(3).toString('hex');
          const name = \`BIOH3-\${rand}\`;
          const symbol = \`B3\${rand.toUpperCase()}\`;

          // -------------------------
          // WALLET
          // -------------------------
          const secret = Uint8Array.from(bs58.default ? bs58.default.decode(process.env.SOLANA_PRIVATE_KEY) : bs58.decode(process.env.SOLANA_PRIVATE_KEY));
          const payer = Keypair.fromSecretKey(secret);

          // -------------------------
          // CONNECTION
          // -------------------------
          const connection = new Connection(
            process.env.SOLANA_RPC || clusterApiUrl('devnet'),
            'confirmed'
          );

          const metaplex = Metaplex.make(connection).use(keypairIdentity(payer));

          (async () => {
            console.log('Creating SPL Mint...');

            // -------------------------
            // 1. CREATE TOKEN MINT
            // -------------------------
            const mint = await createMint(
              connection,
              payer,
              payer.publicKey,
              null,
              9 // decimals
            );

            console.log('Mint Address:', mint.toBase58());

            // -------------------------
            // 2. CREATE TOKEN ACCOUNT
            // -------------------------
            const tokenAccount = await getOrCreateAssociatedTokenAccount(
              connection,
              payer,
              mint,
              payer.publicKey
            );

            // -------------------------
            // 3. MINT EXACTLY 10 TOKENS
            // -------------------------
            const amount = 10 * (10 ** 9); // 10 tokens with 9 decimals

            await mintTo(
              connection,
              payer,
              mint,
              tokenAccount.address,
              payer,
              amount
            );

            console.log('✅ Minted 10 tokens');

            // -------------------------
            // 4. METADATA (Metaplex)
            // -------------------------
            const metadata = {
              name,
              symbol,
              description: 'BIOH3 SPL Token (auto minted supply 10)',
              image: \`https://placehold.co/400x400/png?text=\${encodeURIComponent(name)}\`,
              attributes: [
                { trait_type: 'type', value: 'spl-token' },
                { trait_type: 'supply', value: '10' }
              ]
            };

            const { uri } = await metaplex.nfts().uploadMetadata(metadata);

            console.log('Metadata URI:', uri);

            console.log('============================');
            console.log('TOKEN DEPLOYED SUCCESSFULLY');
            console.log('Name:', name);
            console.log('Symbol:', symbol);
            console.log('Mint:', mint.toBase58());
            console.log('Supply: 10');
            console.log('============================');
          })();
          "
