name: Deploy BIOH3 Token (Fixed Supply 10)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm init -y
          npm install @solana/web3.js @solana/spl-token @metaplex-foundation/js bs58

      - name: Deploy Token + Mint 10 Supply
        env:
          SOLANA_PRIVATE_KEY: ${{ secrets.SOLANA_PRIVATE_KEY }}
          SOLANA_RPC: https://api.devnet.solana.com
        run: |
          node -e "
          const crypto = require('crypto');
          const {
            Connection,
            Keypair,
            clusterApiUrl
          } = require('@solana/web3.js');

          const {
            createMint,
            getOrCreateAssociatedTokenAccount,
            mintTo,
            setAuthority,
            AuthorityType
          } = require('@solana/spl-token');

          const { Metaplex, keypairIdentity } = require('@metaplex-foundation/js');

          const bs58Module = require('bs58');

          // ----------------------------
          // SAFE bs58 decode (fixes ALL versions)
          // ----------------------------
          const decode =
            bs58Module.decode || bs58Module.default?.decode;

          if (!decode) throw new Error('bs58 decode not found');

          // ----------------------------
          // UNIQUE NAME/SYMBOL
          // ----------------------------
          const rand = crypto.randomBytes(3).toString('hex');
          const name = \`BIOH3-\${rand}\`;
          const symbol = \`B3\${rand.toUpperCase()}\`;

          // ----------------------------
          // WALLET
          // ----------------------------
          const secret = Uint8Array.from(
            decode(process.env.SOLANA_PRIVATE_KEY)
          );

          const payer = Keypair.fromSecretKey(secret);

          // ----------------------------
          // CONNECTION
          // ----------------------------
          const connection = new Connection(
            process.env.SOLANA_RPC || clusterApiUrl('devnet'),
            'confirmed'
          );

          const metaplex = Metaplex
            .make(connection)
            .use(keypairIdentity(payer));

          (async () => {
            try {
              console.log('Creating SPL Mint...');

              // ----------------------------
              // 1. CREATE MINT
              // ----------------------------
              const mint = await createMint(
                connection,
                payer,
                payer.publicKey,
                payer.publicKey,
                9
              );

              console.log('Mint:', mint.toBase58());

              // ----------------------------
              // 2. TOKEN ACCOUNT
              // ----------------------------
              const ata = await getOrCreateAssociatedTokenAccount(
                connection,
                payer,
                mint,
                payer.publicKey
              );

              // ----------------------------
              // 3. MINT EXACTLY 10 TOKENS
              // ----------------------------
              await mintTo(
                connection,
                payer,
                mint,
                ata.address,
                payer,
                10 * 1e9
              );

              console.log('Minted: 10 tokens');

              // ----------------------------
              // 4. FREEZE SUPPLY (IMPORTANT)
              // prevents further minting
              // ----------------------------
              await setAuthority(
                connection,
                payer,
                mint,
                payer.publicKey,
                AuthorityType.MintTokens,
                null
              );

              console.log('Mint authority revoked (fixed supply)');

              // ----------------------------
              // 5. METADATA
              // ----------------------------
              const metadata = {
                name,
                symbol,
                description: 'BIOH3 fixed supply token (10 units)',
                image: \`https://placehold.co/400x400/png?text=\${encodeURIComponent(name)}\`,
                attributes: [
                  { trait_type: 'type', value: 'spl-token' },
                  { trait_type: 'supply', value: '10' },
                  { trait_type: 'immutable', value: 'true' }
                ]
              };

              const { uri } = await metaplex
                .nfts()
                .uploadMetadata(metadata);

              console.log('Metadata URI:', uri);

              console.log('==============================');
              console.log('✅ DEPLOY COMPLETE');
              console.log('Name:', name);
              console.log('Symbol:', symbol);
              console.log('Mint:', mint.toBase58());
              console.log('Supply: 10 (locked)');
              console.log('==============================');

            } catch (e) {
              console.error(e);
              process.exit(1);
            }
          })();
          "
