name: Deploy Solana Token Devnet

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      RPC_URL: https://api.devnet.solana.com

      # Token settings
      TOKEN_NAME: MyToken
      TOKEN_SYMBOL: MTK
      TOKEN_DECIMALS: 6
      TOTAL_SUPPLY: 1000000
      MINT_LIMIT: 10000

      # Phantom private key (base58 string)
      PRIVATE_KEY: ${{ secrets.SOLANA_PRIVATE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create deploy script
        run: |
          cat > deploy.js << 'EOF'
          const {
            Connection,
            Keypair,
            clusterApiUrl,
            PublicKey
          } = require("@solana/web3.js");

          const {
            createMint,
            getOrCreateAssociatedTokenAccount,
            mintTo
          } = require("@solana/spl-token");

          const bs58 = require("bs58");

          async function main() {
            const connection = new Connection(
              process.env.RPC_URL,
              "confirmed"
            );

            const secretKey = bs58.decode(
              process.env.PRIVATE_KEY.trim()
            );

            const wallet = Keypair.fromSecretKey(secretKey);

            console.log("Wallet:", wallet.publicKey.toBase58());

            // Devnet SOL
            try {
              const sig = await connection.requestAirdrop(
                wallet.publicKey,
                2e9
              );
              await connection.confirmTransaction(sig);
            } catch {}

            const decimals = Number(
              process.env.TOKEN_DECIMALS
            );

            const totalSupply = Number(
              process.env.TOTAL_SUPPLY
            );

            const mintLimit = Number(
              process.env.MINT_LIMIT
            );

            if (totalSupply > mintLimit) {
              throw new Error(
                "TOTAL_SUPPLY exceeds MINT_LIMIT"
              );
            }

            // Create token mint
            const mint = await createMint(
              connection,
              wallet,
              wallet.publicKey,
              wallet.publicKey,
              decimals
            );

            console.log("Mint Address:", mint.toBase58());

            // Token account
            const tokenAccount =
              await getOrCreateAssociatedTokenAccount(
                connection,
                wallet,
                mint,
                wallet.publicKey
              );

            // Mint supply
            const amount =
              totalSupply * Math.pow(10, decimals);

            await mintTo(
              connection,
              wallet,
              mint,
              tokenAccount.address,
              wallet,
              amount
            );

            console.log(
              "Supply minted:",
              totalSupply
            );

            console.log(
              "Token:",
              mint.toBase58()
            );
          }

          main().catch(console.error);
          EOF

      - name: Install dependencies
        run: |
          npm init -y
          npm install @solana/web3.js @solana/spl-token @metaplex-foundation/js bs58

      - name: Deploy token
        run: node deploy.js
