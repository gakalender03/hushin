name: List Netrun Modules

on:
  workflow_dispatch:

jobs:
  list-modules:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies and run script
        run: |
          npm init -y
          npm install @netrun/sdk

          cat > package.json <<EOF
          {
            "type": "module"
          }
          EOF

          cat > index.js <<'EOF'
          import { Netrun } from '@netrun/sdk';

          const netrun = new Netrun({
            network: 'devnet'
          });

          async function main() {
            try {
              console.log('Fetching modules...\n');

              const modules =
                await netrun.modules.list();

              console.log(
                JSON.stringify(
                  modules,
                  null,
                  2
                )
              );

            } catch (err) {
              console.error(
                'Failed to fetch modules:',
                err
              );
              process.exit(1);
            }
          }

          main();
          EOF

          node index.js
