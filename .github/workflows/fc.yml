name: Auto Mint Token (Devnet)

on:
  workflow_dispatch:

jobs:
  mint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install @solana/web3.js @solana/spl-token @metaplex-foundation/mpl-token-metadata
             npm install bs58@5.0.0

      - name: Run mint script
        env:
          SOLANA_RPC: https://api.devnet.solana.com
          PRIVATE_KEY: ${{ secrets.SOLANA_PRIVATE_KEY }}
        run: node mint.js
