name: Deploy Solana Token (Devnet)

on:
  workflow_dispatch:

jobs:
  deploy-token:
    runs-on: ubuntu-latest

    env:
      SOLANA_NETWORK: devnet

      # Token config
      TOKEN_DECIMALS: 6
      TOTAL_SUPPLY: 1000000
      MINT_LIMIT: 10000

      # Add this in GitHub Secrets
      # Base58 private key wallet
      SOLANA_PRIVATE_KEY: ${{ secrets.SOLANA_PRIVATE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.solana.com/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install SPL Token CLI
        run: cargo install spl-token-cli

      - name: Configure Solana Devnet
        run: solana config set --url https://api.devnet.solana.com

      - name: Setup wallet
        run: |
          mkdir -p ~/.config/solana
          echo "$SOLANA_PRIVATE_KEY" > ~/.config/solana/id.json
          chmod 600 ~/.config/solana/id.json

      - name: Airdrop Devnet SOL
        run: |
          solana airdrop 2 || true

      - name: Create Token
        id: create_token
        run: |
          TOKEN_ADDRESS=$(spl-token create-token \
            --decimals $TOKEN_DECIMALS \
            | grep "Creating token" \
            | awk '{print $3}')

          echo "TOKEN_ADDRESS=$TOKEN_ADDRESS" >> $GITHUB_ENV
          echo "Created token: $TOKEN_ADDRESS"

      - name: Create Token Account
        run: |
          spl-token create-account $TOKEN_ADDRESS

      - name: Mint Limited Supply
        run: |
          MINT_AMOUNT=$TOTAL_SUPPLY

          if [ "$MINT_AMOUNT" -gt "$MINT_LIMIT" ]; then
            echo "Mint exceeds MINT_LIMIT"
            exit 1
          fi

          spl-token mint $TOKEN_ADDRESS $MINT_AMOUNT

      - name: Show Token Info
        run: |
          echo "Token Address: $TOKEN_ADDRESS"
          spl-token supply $TOKEN_ADDRESS
          spl-token display $TOKEN_ADDRESS
