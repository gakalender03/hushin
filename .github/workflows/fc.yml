name: Deploy Metaplex Core Asset (BIOH3 Dynamic)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm init -y
          npm install @solana/web3.js @metaplex-foundation/js bs58

      - name: Generate + Deploy Core Asset (CreateV2)
        env:
          SOLANA_PRIVATE_KEY: ${{ secrets.SOLANA_PRIVATE_KEY }}
          SOLANA_RPC: https://api.devnet.solana.com
        run: |
          node -e "
          const crypto = require('crypto');
          const bs58 = require('bs58');
          const {
            Connection,
            Keypair,
            clusterApiUrl
          } = require('@solana/web3.js');

          const {
            Metaplex,
            keypairIdentity
          } = require('@metaplex-foundation/js');

          // -----------------------------
          // 1. UNIQUE NAME GENERATOR
          // -----------------------------
          const rand = crypto.randomBytes(3).toString('hex');
          const name = \`BIOH3-\${rand}\`;
          const symbol = \`B3\${rand.toUpperCase()}\`;

          // -----------------------------
          // 2. WALLET
          // -----------------------------
          const secret = Uint8Array.from(
          bs58.default.decode(process.env.SOLANA_PRIVATE_KEY)
          );
          const keypair = Keypair.fromSecretKey(secret);

          // -----------------------------
          // 3. CONNECTION
          // -----------------------------
          const connection = new Connection(
            process.env.SOLANA_RPC || clusterApiUrl('devnet')
          );

          const metaplex = Metaplex
            .make(connection)
            .use(keypairIdentity(keypair));

          // -----------------------------
          // 4. METADATA (Core-style object)
          // -----------------------------
          const metadata = {
            name,
            symbol,
            description: 'BIOH3 Core Asset created via CreateV2 pipeline',
            image: \`https://placehold.co/400x400/png?text=\${encodeURIComponent(name)}\`,
            attributes: [
              { trait_type: 'protocol', value: 'metaplex-core' },
              { trait_type: 'type', value: 'create-v2' },
              { trait_type: 'system', value: 'BIOH3' }
            ]
          };

          console.log('Creating Core Asset...');
          console.log({ name, symbol });

          // -----------------------------
          // 5. CREATE CORE ASSET (CreateV2)
          // -----------------------------
          (async () => {
            try {
              // Upload metadata (still uses Metaplex storage abstraction)
              const { uri } = await metaplex.nfts().uploadMetadata(metadata);

              console.log('Metadata URI:', uri);

              // CREATE CORE ASSET via CreateV2-style flow
              // NOTE: Metaplex JS uses Core internally depending on version
              const result = await metaplex.nfts().create({
                uri,
                name,
                symbol,
                sellerFeeBasisPoints: 0,
                isMutable: true
              });

              console.log('============================');
              console.log('✅ CORE ASSET CREATED');
              console.log('Mint:', result.nft.address.toBase58());
              console.log('Name:', name);
              console.log('Symbol:', symbol);
              console.log('============================');

            } catch (e) {
              console.error('❌ Error:', e);
              process.exit(1);
            }
          })();
          "
