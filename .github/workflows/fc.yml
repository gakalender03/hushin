name: List Netrun Modules

on:
  workflow_dispatch:

jobs:
  list-modules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create package.json
        run: |
          cat > package.json <<EOF
          {
            "type": "module"
          }
          EOF

      - name: Install dependencies
        run: |
          npm install @netrun/sdk

      - name: Create script
        run: |
          cat > list-modules.js <<'EOF'
          import { Netrun } from '@netrun/sdk';

          const netrun = new Netrun({
            network: 'devnet'
          });

          async function main() {
            try {
              const modules =
                await netrun.modules.list();

              console.log(
                JSON.stringify(
                  modules,
                  null,
                  2
                )
              );
            } catch (err) {
              console.error(
                'Failed to fetch modules:',
                err
              );
              process.exit(1);
            }
          }

          main();
          EOF

      - name: Run script
        run: |
          node list-modules.js
