name: Solana Pubkey

on:
  workflow_dispatch:

jobs:
  pubkey:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install solders
        run: |
          python -m pip install --upgrade pip
          pip install solders

      - name: Derive public key
        env:
          SOLANA_PRIVATE_KEY_B58: ${{ secrets.SOLANA_PRIVATE_KEY_B58 }}
        run: |
          python - <<'PY'
          import os
          from solders.keypair import Keypair

          from base58 import b58decode

          b58_string = os.environ["SOLANA_PRIVATE_KEY_B58"]
          # Decode base58 to bytes
          secret_bytes = b58decode(b58_string)
          # Transform to uint8 array (list of integers) for keypair.json
          arr = list(secret_bytes)
          print("JSON‑compatible keypair array (copy this into keypair.json):")
          print(arr)
          PY
