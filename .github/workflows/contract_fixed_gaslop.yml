name: Contract Transfers

on:
  workflow_dispatch:
  
    

jobs:
  transfer:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install web3.py
        run: pip install web3

      - name: Run contract transfers
        env:
          PRIVATE_KEYS: ${{ secrets.PRIVATE_KEYDAC }}
        run: |
          for i in $(seq 1 100); do
            echo "Run ke-$i"
            python sendca.py
            sleep 60
          done
