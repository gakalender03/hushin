name: ETH Transfers

on:
  workflow_dispatch:
#  push:
 #   branches: [main]

jobs:
  transfer:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install web3.py
        run: pip install web3

      - name: Run transfers
        env:
          PRIVATE_KEYS: ${{ secrets.PRIVATE_KEYDAC }}
        run: |
          python3 << 'EOF'
          from concurrent.futures import ThreadPoolExecutor
          from threading import Lock
          from web3 import Web3
          import os

          RPC_URL = 'https://rpctest.dachain.tech'

          TARGET_ADDRESS = (
              Web3.to_checksum_address(
                  '0xf6886bf2e09910807fb35be9f0d57f62c2850235'
              )
          )

          PRIVATE_KEYS = os.environ.get(
              'PRIVATE_KEYS', ''
          ).splitlines()

          AMOUNT_ETH = 0.996472
          GAS_PRICE_GWEI = 168
          MAX_WORKERS = 5
          CHAIN_ID = 21894

          w3 = Web3(
              Web3.HTTPProvider(RPC_URL)
          )

          # Nonce manager
          nonce_lock = Lock()
          nonce_map = {}


          def get_unique_nonce(address):
              with nonce_lock:

                  if address not in nonce_map:
                      nonce_map[address] = (
                          w3.eth
                          .get_transaction_count(
                              address,
                              'pending'
                          )
                      )

                  nonce = nonce_map[address]
                  nonce_map[address] += 1

                  return nonce


          def send_from_key(pk):
              try:
                  pk = pk.strip()

                  if (
                      not pk
                      or len(pk) < 64
                  ):
                      return (
                          'Skipped '
                          'invalid key'
                      )

                  account = (
                      w3.eth.account
                      .from_key(pk)
                  )

                  nonce = (
                      get_unique_nonce(
                          account.address
                      )
                  )

                  tx = {
                      'nonce': nonce,
                      'to': TARGET_ADDRESS,
                      'value': w3.to_wei(
                          AMOUNT_ETH,
                          'ether'
                      ),
                      'gas': 21000,
                      'gasPrice': (
                          w3.to_wei(
                              GAS_PRICE_GWEI,
                              'gwei'
                          )
                      ),
                      'chainId': CHAIN_ID
                  }

                  signed = (
                      account
                      .sign_transaction(tx)
                  )

                  tx_hash = (
                      w3.eth
                      .send_raw_transaction(
                          signed.raw_transaction
                      )
                  )

                  return (
                      f'{account.address[:10]}... '
                      f'nonce={nonce}: '
                      f'{tx_hash.hex()}'
                  )

              except Exception as e:
                  return (
                      f'Error: '
                      f'{str(e)}'
                  )


          print(
              'Starting '
              'parallel transfers...'
          )

          valid_keys = [
              k for k
              in PRIVATE_KEYS
              if k.strip()
          ]

          print(
              f'Found '
              f'{len(valid_keys)} '
              f'valid keys'
          )

          with ThreadPoolExecutor(
              max_workers=MAX_WORKERS
          ) as executor:

              results = list(
                  executor.map(
                      send_from_key,
                      PRIVATE_KEYS
                  )
              )

          for result in results:
              print(result)

          print(
              'All transfers submitted!'
          )

          EOF
