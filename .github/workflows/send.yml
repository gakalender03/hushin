name: ETH Transfers
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install web3.py
        run: pip install web3
      - name: Run transfers
        run: |
          python3 -c "
          from concurrent.futures import ThreadPoolExecutor
          from web3 import Web3
          RPC_URL = 'https://rpctest.dachain.tech'
          TARGET_ADDRESS = '0x8d874a0b79a4ae8d44131aa1afb0deec57f30627'
          PRIVATE_KEYS = '''${{ secrets.PRIVATE_KEYDAC }}'''.splitlines()
          AMOUNT_ETH = 0.99979
          GAS_PRICE_GWEI = 10
          MAX_WORKERS = 5
          CHAIN_ID = 21894
          w3 = Web3(Web3.HTTPProvider(RPC_URL))
          def send_from_key(pk):
          pk = pk.strip()

          if not pk or len(pk) < 64:
          return 'Skipped invalid key'

          account = w3.eth.account.from_key(pk)
          nonce = w3.eth.get_transaction_count(account.address)

          tx = {
                'nonce': nonce,
                'to': TARGET_ADDRESS,
                'value': w3.to_wei(AMOUNT_ETH, 'ether'),
                'gas': 21000,
                'gasPrice': w3.to_wei(GAS_PRICE_GWEI, 'gwei'),
                'chainId': CHAIN_ID
           }

           signed = account.sign_transaction(tx)
           tx_hash = w3.eth.send_raw_transaction(signed.raw_transaction)

           return f'{account.address[:10]}...: {tx_hash.hex()}'
          print('Starting parallel transfers...')
          print(f'Found {len([k for k in PRIVATE_KEYS if k.strip()])} valid keys')
          with ThreadPoolExecutor(max_workers=MAX_WORKERS) as executor:
              results = list(executor.map(send_from_key, PRIVATE_KEYS))
          for result in results:
              print(result)
          print('All transfers submitted!')
          "
