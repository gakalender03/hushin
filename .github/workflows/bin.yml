name: Faucet Runner

on:
  workflow_dispatch:

jobs:
  faucet:
    runs-on: ubuntu-latest

    steps:
      - name: Test Faucet
        shell: bash
        run: |
          set -x

          BASE_URL="https://inception.dachain.io"
          API_URL="$BASE_URL/api/inception/faucet/"
          WALLET="0x14ab4EB8ec77728AdE985C9873fc9E5cad867292"

          echo "=== STEP 1: Get faucet page ==="

          HTML=$(curl -L -s \
            -H "User-Agent: Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36" \
            -H "Referer: $BASE_URL/faucet" \
            -H "Origin: $BASE_URL" \
            -D - \
            "$BASE_URL/faucet")

          echo "=== HTML RESPONSE ==="
          echo "$HTML" | head -100

          echo "=== STEP 2: Try extract csrf token ==="

          CSRF_TOKEN=$(echo "$HTML" | grep -oP 'csrf[a-zA-Z0-9_-]*["'\'']?\s*[:=]\s*["'\'']\K[^"'\'']+' | head -1)

          echo "CSRF_TOKEN=$CSRF_TOKEN"

          echo "=== STEP 3: Request faucet ==="

          curl -v \
            -X POST "$API_URL" \
            -H "Content-Type: application/json" \
            -H "Origin: $BASE_URL" \
            -H "Referer: $BASE_URL/faucet" \
            -H "User-Agent: Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36" \
            -H "X-CSRFToken: $CSRF_TOKEN" \
            --data-raw "{
              \"id\": 4,
              \"jsonrpc\": \"2.0\",
              \"method\": \"faucet_request\",
              \"params\": [\"$WALLET\"]
            }"
